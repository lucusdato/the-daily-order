# Sends the 4 AM "today's order" email through Buttondown.
# Needs the repository secret BUTTONDOWN_API_KEY (Buttondown > Settings > API).
# GitHub schedules run in UTC, so it runs at both 08:07 and 09:07 UTC to cover daylight saving.
# The script only sends after 4 AM Toronto time, and never sends the same order twice.
name: Daily order email
on:
  schedule:
    - cron: '7 8,9 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/send-email.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
